<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA WEB</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <form>
        <input type="text" id="pantalla" readonly> <br>

        <button type="button" id="uno" class="boton">1</button>
        <button type="button" id="dos" class="boton">2</button>
        <button type="button" id="tres" class="boton">3</button>
        <button type="button" id="division" class="boton">/</button>
        <br>
        <button type="button" id="cuatro" class="boton">4</button>
        <button type="button" id="cinco" class="boton">5</button>
        <button type="button" id="seis" class="boton">6</button>
        <button type="button" id="porciento" class="boton">%</button>        
        <br>
        <button type="button" id="siete" class="boton">7</button>
        <button type="button" id="ocho" class="boton">8</button>
        <button type="button" id="nueve" class="boton">9</button>
        <button type="button" id="multiplicacion" class="boton">*</button>
        <br>
        <button type="button" id="cero" class="boton">0</button>
        <button type="button" id="mas" class="boton">+</button>
        <button type="button" id="menos" class="boton">-</button>      
        <button type="button" id="limpiar" class="boton" >C</button>
        <br>
        <button type="button" id="igual" class="botoni">=</button>
        
        
    </form>
    <script src="./js/script.js"></script>
    
</body>
</html>
